{% extends "base.html" %}
{% block title %}Admin - The Streaking of Isaac{% endblock %}
{% block content %}
<h1>Admin Panel</h1>

<h2>Create leaderboard</h2>
<form method="post" action="/admin/leaderboard/{% if let Some(pl) = prefill_leaderboard %}update{% else %}create{% endif %}">
    {% if let Some(pl) = prefill_leaderboard %}
        <label class="warn-edit">⚠ you are editing {{ pl.slug }} table ⚠</label>
        <input type="hidden" name="id" value="{{ pl.id }}">
    {% endif %}
    <input type="text" name="slug" placeholder="slug (ex: eden-all-chapter)" required
        value="{% if let Some(pl) = prefill_leaderboard %}{{ pl.slug }}{% endif %}">
    <input type="text" name="title" placeholder="Displayed leaderboard name" required
        value="{% if let Some(pl) = prefill_leaderboard %}{{ pl.title }}{% endif %}">
    <input type="text" name="description" placeholder="Description (optional)"
        value="{% if let Some(pl) = prefill_leaderboard %}{% if let Some(desc) = pl.description %}{{ desc }}{% endif %}{% endif %}">
    <input type="text" name="unit" placeholder="Unit (ex: Best Steak, Time, Death Count)"
        value="{% if let Some(pl) = prefill_leaderboard %}{{ pl.unit }}{% endif %}">
    <input type="text" name="stat" placeholder="Stat (ex: Status, No Reset, Speedrun)"
        value="{% if let Some(pl) = prefill_leaderboard %}{{ pl.stat }}{% endif %}">
    <label><input type="checkbox" name="lower_is_better"
        value="{% if let Some(pl) = prefill_leaderboard %}{{ pl.lower_is_better }}{% else %}{{ true }}{% endif %}"> Lowest score = best (for timed leaderboards)</label>
    <button type="submit">{% if let Some(pl) = prefill_leaderboard %}Update{% else %}Create{% endif %}</button>
</form>

<h2>Existing leaderboards</h2>
{% for lb in leaderboards %}
<tr>
    <td><a href="/leaderboard/{{ lb.slug }}">{{ lb.title }}</a></td>
    <td class="actions">
        <a href="/admin?slug={{ lb.slug }}" class="btn-square btn-edit" title="Modify">✎</a>
        <form method="post" action="/admin/leaderboard/remove" class="inline-form"
            onsubmit="return confirm('Remove {{ lb.title }}\'s leaderboard ?');">
            <input type="hidden" name="id" value="{{ lb.id }}">
            <button type="submit" class="btn-square btn-remove" title="Remove">✘</button>
        </form>
    </td>
</tr>
{% endfor %}
{% endblock %}
